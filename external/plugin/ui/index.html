<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>渗透测试工作台</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="model.js"></script>
  <script defer src="dom.js"></script>
  <script defer src="plan.js"></script>
  <script defer src="progress.js"></script>
  <script defer src="report.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#panel-content">跳到当前内容</a>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>渗透测试工作台</span></div>
    <span class="topbar-note">规划 / 验证 / 证据 / 报告</span>
  </header>
  <main class="workspace">
    <section class="engagement-heading" aria-label="当前任务">
      <div class="title-block"><p class="eyebrow">证据驱动的安全测试</p><h1 id="task-title">等待任务上下文</h1><p id="task-meta" class="muted">连接宿主面板后读取真实记录。</p></div>
      <button id="refresh" class="button primary" type="button" disabled>刷新记录</button>
    </section>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <div class="tabs" role="tablist" aria-label="工作台视图">
      <button id="tab-plan" type="button" role="tab" aria-selected="true" aria-controls="panel-content">计划与进度</button>
      <button id="tab-report" type="button" role="tab" aria-selected="false" aria-controls="panel-content" tabindex="-1">渗透报告</button>
    </div>
    <section id="panel-content" role="tabpanel" aria-labelledby="tab-plan" tabindex="0"></section>
    <footer class="footer">只读记录视图 · 不触发扫描 · 所有结论以留存证据为准</footer>
  </main>
</body>
</html>
